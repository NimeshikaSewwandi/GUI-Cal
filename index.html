<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive GUI calculator built with HTML, CSS and JavaScript.">
  <title>GUI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">SIMPLE TOOLS · EVERYDAY MATH</p>
      <h1>GUI Calculator</h1>
      <p class="subtitle">A simple, responsive calculator built with HTML, CSS and JavaScript.</p>
    </header>
    <section class="calculator" aria-label="Calculator">
      <div class="topbar"><span class="status-dot"></span><span>CALCULATOR</span><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme">◐</button></div>
      <div class="display"><div id="history" class="history" aria-live="polite"></div><output id="screen" class="screen" aria-label="Display" aria-live="polite">0</output></div>
      <div class="keys" id="keys">
        <button class="key utility" data-action="clear" type="button">AC</button><button class="key utility" data-action="delete" type="button">DEL</button><button class="key utility" data-action="sign" type="button">+/−</button><button class="key operator" data-operator="/" type="button">÷</button>
        <button class="key" data-number="7" type="button">7</button><button class="key" data-number="8" type="button">8</button><button class="key" data-number="9" type="button">9</button><button class="key operator" data-operator="*" type="button">×</button>
        <button class="key" data-number="4" type="button">4</button><button class="key" data-number="5" type="button">5</button><button class="key" data-number="6" type="button">6</button><button class="key operator" data-operator="-" type="button">−</button>
        <button class="key" data-number="1" type="button">1</button><button class="key" data-number="2" type="button">2</button><button class="key" data-number="3" type="button">3</button><button class="key operator" data-operator="+" type="button">+</button>
        <button class="key utility" data-action="percent" type="button">%</button><button class="key" data-number="0" type="button">0</button><button class="key" data-action="decimal" type="button">.</button><button class="key equals" data-action="equals" type="button">=</button>
      </div>
      <p class="hint">Tip: You can also use your keyboard.</p>
    </section>
    <footer>Built with HTML · CSS · JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
